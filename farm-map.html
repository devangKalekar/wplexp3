<!DOCTYPE html>
<html>
<head>
    <title>Farm Location Map</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1, h2 {
            color: #1b5e20;
        }

        /* Image Gallery Styling */
        .gallery {
            margin: 25px 0;
        }

        .gallery img {
            width: 220px;
            height: 160px;
            object-fit: cover;
            border: 3px solid #2e7d32;
            border-radius: 8px;
            margin: 10px;
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <h1>My Farm Map</h1>
    <p>Click on different areas of the farm to see details.</p>

    <!-- Your original farm image with image map -->
    <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef"
         alt="Green agricultural farm fields"
         width="600"
         usemap="#farmmap">

    <map name="farmmap">
        <area shape="rect"
              coords="50,80,250,220"
              href="crop-details.html"
              alt="Field 1 - Wheat Crop">
        <area shape="rect"
              coords="270,80,500,220"
              href="irrigation.html"
              alt="Field 2 - Irrigation Area">
        <area shape="rect"
              coords="50,240,250,400"
              href="crop-details.html"
              alt="Field 3 - Rice Crop">
        <area shape="rect"
              coords="270,240,500,400"
              href="irrigation.html"
              alt="Field 4 - Water Supply">
    </map>

    <h2>Farm Information</h2>
    <p>Click on any field to view crop or irrigation information.</p>

    <!-- Image Gallery Section (for Task 6) -->
    <h2>Farm Gallery</h2>
    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef" alt="Farm Field 1">
        <img src="https://images.unsplash.com/photo-1464226184884-fa280b87c399" alt="Farm Field 2">
        <img src="https://images.unsplash.com/photo-1500937386664-56d1dfef6921" alt="Irrigation Area">
        <img src="https://images.unsplash.com/photo-1625246333195-78d9c38ad449" alt="Crop Field">
    </div>

</body>
</html>
