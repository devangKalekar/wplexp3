<!DOCTYPE html>
<html>
<head>
    <title>Smart Irrigation Advisory System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }

        h1, h2, h3 {
            color: #1b5e20;
        }

        /* Special Offer / Advisory Box */
        .offer-box {
            background-color: #ffeb3b;
            color: #1b5e20;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            margin: 30px auto;
            width: 75%;
            border-radius: 12px;
            box-shadow: 0 0 15px #fbc02d;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            animation: glow 1.5s infinite alternate;
        }

        /* Glowing animation */
        @keyframes glow {
            from {
                box-shadow: 0 0 10px #fbc02d;
                transform: scale(1);
            }
            to {
                box-shadow: 0 0 25px #f57f17;
                transform: scale(1.03);
            }
        }
    </style>
</head>
<body>

    <div style="text-align:center;">
        <h1>Smart Irrigation Advisory System</h1>
        <h2>🌾 ABC Agriculture Organization</h2>
        <p title="This system helps farmers decide when and how much to irrigate their crops.">
            Welcome to our Smart Irrigation Advisory Portal
        </p>
        <h3>Current Crop Season: Kharif 2026</h3>
        <p style="color:green;">
            Helping farmers save water and grow healthy crops.
        </p>
    </div>

    <!-- Special Offer / Advisory Box -->
    <div class="offer-box">
        Special Advisory: Water your crops early morning today for best results and water saving!
    </div>

</body>
</html>
